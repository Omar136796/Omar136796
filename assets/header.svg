<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </linearGradient>
    <clipPath id="shape">
      <path d="M0 0 H1200 V190 C1000 240 800 150 600 195 C400 240 200 160 0 200 Z"/>
    </clipPath>
    <style>
      .w1 { animation: drift900 9s linear infinite; }
      .w2 { animation: drift1200 14s linear infinite; }
      .title { font: 700 64px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #FFFFFF; animation: fadeup 1.4s ease-out 0.2s both; }
      .sub { font: 500 20px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #E0F7FB; letter-spacing: 1px; animation: fadeup 1.4s ease-out 0.8s both; }
      @keyframes drift900 { from { transform: translateX(0); } to { transform: translateX(-900px); } }
      @keyframes drift1200 { from { transform: translateX(0); } to { transform: translateX(-1200px); } }
      @keyframes fadeup { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </defs>
  <g clip-path="url(#shape)">
    <rect width="1200" height="240" fill="url(#bg)"/>
    <g class="w1">
      <path fill="url(#wave)" d="M0 170 C150 130 300 210 450 170 C600 130 750 210 900 170 C1050 130 1200 210 1350 170 C1500 130 1650 210 1800 170 C1950 130 2100 210 2250 170 C2400 130 2550 210 2700 170 V240 H0 Z"/>
    </g>
    <g class="w2">
      <path fill="#0F172A" fill-opacity="0.25" d="M0 190 C200 160 400 220 600 190 C800 160 1000 220 1200 190 C1400 160 1600 220 1800 190 C2000 160 2200 220 2400 190 V240 H0 Z"/>
    </g>
  </g>
  <text class="title" x="600" y="100" text-anchor="middle">Omar Faruk</text>
  <text class="sub" x="600" y="140" text-anchor="middle">COMPUTER SCIENCE &amp; ENGINEERING · BRAC UNIVERSITY</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
